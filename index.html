<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Hollywood Cut</title>
  <meta name="description" content="打造您的专属电影时刻：生成并保存电影片场合影。" />
  <meta name="theme-color" content="#FAF9F6" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Hollycut" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;800&family=Rye&display=swap"
    rel="stylesheet">
  <style>
    body {
      background-color: #FAF9F6;
      /* Warm Paper White */
      font-family: 'Inter', sans-serif;
      color: #002FA7;
      /* Klein Blue text */
      margin: 0;
      overflow-x: hidden;
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: 'Playfair Display', serif;
    }

    .western-font {
      font-family: 'Rye', serif;
    }

    /* Klein Blue Selection */
    ::selection {
      background: #002FA7;
      color: #ffffff;
    }

    /* Custom Scrollbar - Blue & Orange */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #E5E7EB;
    }

    ::-webkit-scrollbar-thumb {
      background: #002FA7;
      border: 2px solid #FAF9F6;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #FF4500;
      /* Sunset Orange hover */
    }

    /* Utility for text outlines/strokes if needed */
    .text-stroke-blue {
      -webkit-text-stroke: 1px #002FA7;
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
